<!-- hero-course-explorer.html -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skillex - Professional Learning Platform</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap');

  :root {
    --bg-soft: #f4f4f2;
    --card-bg: #ffffff;
    --text-main: #1a1e2d;
    --text-muted: #666666;
    --accent: #fdb181;
    --accent-hover: #fa9d63;
    --dark: #1a1e2d;
    --radius-lg: 40px;
    --radius-md: 20px;
    --transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body { 
    font-family: 'Outfit', sans-serif; 
    background: radial-gradient(circle at top right, #fdfdfd 0%, #f4f4f2 100%);
    color: var(--text-main);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Full Hero Container */
  .c6-hero {
    width: 100%;
    max-width: 1600px;
    margin: 0 auto;
    padding: 60px 100px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  .c6-nav { 
    display: flex; 
    justify-content: space-between; 
    align-items: center; 
    margin-bottom: 60px; 
    position: relative;
    z-index: 100;
  }
  .c6-logo { 
    font-size: 1.8rem; 
    font-weight: 700; 
    letter-spacing: -0.5px;
    z-index: 101;
  }
  .c6-logo span { color: var(--accent); }

  .c6-menu { display: flex; gap: 40px; }
  .c6-menu a { 
    text-decoration: none; 
    font-size: 0.95rem; 
    color: var(--text-muted); 
    font-weight: 500;
    transition: var(--transition);
  }
  .c6-menu a:hover { color: var(--text-main); }

  /* Hamburger Menu Styles */
  .c6-hamburger {
    display: none;
    flex-direction: column;
    gap: 6px;
    cursor: pointer;
    background: none;
    border: none;
    padding: 10px;
    z-index: 101;
  }
  .c6-hamburger span {
    display: block;
    width: 28px;
    height: 2.5px;
    background: var(--text-main);
    border-radius: 2px;
    transition: var(--transition);
  }

  .c6-mobile-nav {
    position: fixed;
    top: 0;
    right: -100%;
    width: 80%;
    height: 100vh;
    background: white;
    z-index: 99;
    display: flex;
    flex-direction: column;
    padding: 120px 40px;
    gap: 30px;
    box-shadow: -10px 0 30px rgba(0,0,0,0.05);
    transition: right 0.5s cubic-bezier(0.23, 1, 0.32, 1);
  }
  .c6-mobile-nav.open { right: 0; }
  .c6-mobile-nav a {
    font-size: 1.5rem;
    font-weight: 600;
    text-decoration: none;
    color: var(--text-main);
  }

  .c6-actions { display: flex; align-items: center; gap: 25px; }
  .c6-login { 
    font-size: 0.95rem; 
    color: var(--text-main); 
    text-decoration: none; 
    font-weight: 600; 
  }
  .c6-trial { 
    background: var(--dark); 
    color: white; 
    padding: 12px 28px; 
    border-radius: 30px; 
    font-size: 0.95rem; 
    text-decoration: none; 
    font-weight: 600;
    transition: var(--transition);
  }
  .c6-trial:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }

  /* Hero Main Content */
  .c6-main { 
    display: grid;
    grid-template-columns: 1fr 1.5fr;
    gap: 60px;
    align-items: center;
    margin-bottom: 60px;
  }

  .c6-left { padding-top: 20px; }
  .c6-title { 
    font-size: 5.5rem; 
    line-height: 1.05; 
    font-weight: 600; 
    color: var(--text-main); 
    margin-bottom: 40px; 
    letter-spacing: -2px;
  }

  /* Search Bar */
  .c6-search-container {
    position: relative;
    width: 100%;
    max-width: 500px;
    z-index: 5;
  }
  .c6-search { 
    display: flex; 
    align-items: stretch; 
    gap: 0; /* Attached seamlessly */
    background: white;
    box-shadow: 0 15px 45px rgba(0,0,0,0.08); 
    border: 1px solid #eee;
    padding: 0;
  }
  .c6-search input { 
    flex: 1; 
    border: none; 
    padding: 18px 25px; 
    outline: none; 
    font-size: 1.1rem; 
    font-family: inherit;
    color: var(--text-main);
    background: transparent;
    border-radius: 0; /* Square corners */
  }
  .c6-search input::placeholder { color: #bbb; }
  .c6-search button { 
    background: linear-gradient(to bottom, #8BBF77 50%, var(--accent) 50%);
    background-size: 100% 200%;
    background-position: 0 100%; 
    border: none; 
    padding: 16px 45px; 
    border-radius: 0; /* Square corners */
    color: var(--text-main);
    font-weight: 700; 
    cursor: pointer; 
    transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
    font-size: 1.1rem; 
    overflow: hidden;
    position: relative;
  }
  .c6-search button:hover { 
    background-position: 0 0%; /* Slides the green color down from the top */
    color: white;
    transform: scale(1.02);
  }

  /* Cards Grid - Accordion Logic */
  .c6-right { 
    display: flex; 
    gap: 15px; 
    height: 550px;
  }
  .c6-card { 
    border-radius: 16px; /* Reduced corner radius */
    overflow: hidden; 
    position: relative; 
    flex: 1;
    min-width: 0; /* Important for flex-grow */
    transition: flex 0.7s cubic-bezier(0.23, 1, 0.32, 1), transform 0.4s ease; 
    cursor: pointer; 
  }
  
  /* Initial state: first card is larger */
  .c6-card:first-child { flex: 2.5; }
  
  /* On hover: grow the current card */
  .c6-card:hover { flex: 2.5; transform: translateY(-5px); }
  
  /* When container is hovered, ensure non-hovered cards shrink */
  .c6-right:hover .c6-card:not(:hover) { flex: 0.8; }
  
  .c6-card img { 
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    height: 100%;
    width: auto;
    max-width: none;
    display: block; 
  }

  /* Card Overlays */
  .c6-card::after { 
    content: ''; 
    position: absolute; 
    inset: 0; 
    background: linear-gradient(to top, rgba(0,0,0,0.6) 0%, transparent 60%); 
  }
  
  .c6-card-content { 
    position: absolute; 
    bottom: 30px; 
    left: 30px; 
    right: 30px; 
    color: white; 
    z-index: 2; 
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    transition: all 0.4s ease;
  }

  .c6-card-title { font-size: 2.2rem; font-weight: 600; line-height: 1.1; white-space: nowrap; }
  .c6-card-topics { text-align: right; }
  .c6-card-topics .num { font-size: 2rem; font-weight: 700; display: block; line-height: 1; }
  .c6-card-topics .label { font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 2px; opacity: 0.8; }

  /* Side Card Overlays (Hide topics when small, show vertical text) */
  .c6-card-side-content {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: flex-start; /* Align flush to the left edge */
    padding-bottom: 30px;
    z-index: 3;
    opacity: 1;
    transition: opacity 0.4s ease;
    /* Gradient background that only runs half way up */
    background: linear-gradient(to top, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0.3) 30%, transparent 50%);
  }
  .c6-card:hover .c6-card-side-content { opacity: 0; pointer-events: none; }
  
  /* Initial state logic for first card and desktop hovers */
  .c6-card:not(:hover) .c6-card-content { opacity: 0; transform: translateY(10px); }
  .c6-card:first-child .c6-card-content { opacity: 1; transform: translateY(0); }
  .c6-card:first-child .c6-card-side-content { opacity: 0; }
  
  /* Reset first-child when another card is hovered */
  .c6-right:hover .c6-card:first-child:not(:hover) .c6-card-content { opacity: 0; transform: translateY(10px); }
  .c6-right:hover .c6-card:first-child:not(:hover) .c6-card-side-content { opacity: 1; }

  .c6-vertical-text {
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    font-size: 1.8rem;
    font-weight: 600;
    white-space: nowrap;
    color: white;
    text-transform: capitalize;
    padding: 20px 10px;
    position: relative;
    /* Corrected for 180deg rotation: placing solid color at the visual bottom */
    background: linear-gradient(to top, transparent 50%, #1C1D2D 50%);
    border-radius: 0;
  }

  /* Bottom Section */
  .c6-bottom-info { 
    text-align: center; 
    margin-top: auto;
    padding: 40px 0;
  }
  .c6-bottom-info h3 { 
    font-size: 2.5rem; 
    font-weight: 600; 
    color: var(--text-main); 
    letter-spacing: -1px;
    margin: 0;
  }

  @media (max-width: 1200px) {
    .c6-hero { padding: 40px 60px; }
    .c6-title { font-size: 4.5rem; }
    .c6-main { grid-template-columns: 1fr; gap: 40px; }
    .c6-right { height: 450px; }
  }

  @media (max-width: 768px) {
    .c6-hero { 
      padding: 30px 20px; 
      overflow-x: hidden; /* Prevent any leakage from causing page scroll */
    }
    .c6-menu, .c6-actions { display: none; }
    
    .c6-hamburger { display: flex; }
    /* Hamburger animation when open */
    .c6-hamburger.active span:nth-child(1) { transform: translateY(8.5px) rotate(45deg); }
    .c6-hamburger.active span:nth-child(2) { opacity: 0; }
    .c6-hamburger.active span:nth-child(3) { transform: translateY(-8.5px) rotate(-45deg); }

    .c6-title { font-size: 3.5rem; letter-spacing: -1px; margin-bottom: 30px; }
    
    /* Mobile Card Consideration: Horizontal Peeking Scroll */
    .c6-right { 
      height: 400px; 
      width: calc(100% + 40px); /* Fill the bleed area */
      overflow-x: auto; 
      overflow-y: hidden;
      padding: 10px 0 20px 0;
      gap: 15px;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      margin: 0 -20px; /* Bleed to edges accurately */
      padding-left: 20px;
      padding-right: 20px;
      display: flex; /* Ensure horizontal flex on mobile */
    }
    .c6-right::-webkit-scrollbar { display: none; }
    
    .c6-card { 
      flex: 0 0 300px; /* Consistent size for swiping */
      scroll-snap-align: center;
      height: 100%;
      transform: none !important; /* Disable hover lifts */
    }
    .c6-card:first-child { flex: 0 0 300px; }
    .c6-right:hover .c6-card:not(:hover) { flex: 0 0 300px; }
    
    /* Force expanded state on mobile (disable hover/initial state logic) */
    .c6-card-content { 
      opacity: 1 !important; 
      transform: translateY(0) !important; 
    }
    .c6-card-side-content { 
      opacity: 0 !important; 
      display: none; 
    }
    
    /* Disable all hover-triggered flex changes */
    .c6-card:hover { flex: 0 0 300px !important; }
    .c6-right:hover .c6-card { flex: 0 0 300px !important; }
    .c6-card-title { font-size: 1.8rem; }
    .c6-card-topics .num { font-size: 1.5rem; }

    .c6-bottom-info h3 { font-size: 1.8rem; line-height: 1.2; }

    /* Fix search bar on mobile */
    .c6-search button {
      padding: 16px 25px;
      font-size: 1rem;
    }
    .c6-search input {
      padding: 18px 15px;
      font-size: 1rem;
      min-width: 0;
    }
  }
</style>
</head>
<body>
  <div class="c6-hero">
    <!-- Navbar -->
    <nav class="c6-nav">
      <div class="c6-logo">Skillex<span>.</span></div>
      
      <!-- Desktop Menu -->
      <div class="c6-menu">
        <a href="#">Find passion</a>
        <a href="#">Categories</a>
        <a href="#">Skills</a>
        <a href="#">Customer</a>
      </div>

      <div class="c6-actions">
        <a href="#" class="c6-login">Login</a>
        <a href="#" class="c6-trial">Free Trial</a>
      </div>

      <!-- Mobile Hamburger -->
      <button class="c6-hamburger" id="hamburger">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <!-- Mobile Nav Overlay -->
      <div class="c6-mobile-nav" id="mobileNav">
        <a href="#">Find passion</a>
        <a href="#">Categories</a>
        <a href="#">Skills</a>
        <a href="#">Customer</a>
        <a href="#" style="margin-top: 20px; color: var(--accent);">Login</a>
        <a href="#" class="c6-trial" style="text-align: center; color: white !important;">Free Trial</a>
      </div>
    </nav>
    
    <!-- Hero Main -->
    <main class="c6-main">
      <div class="c6-left">
        <h1 class="c6-title">Watch.<br>Learn.<br>Grow.</h1>
        <div class="c6-search-container">
          <div class="c6-search">
            <input type="text" placeholder="Find your passion">
            <button>Go</button>
          </div>
        </div>
      </div>
      
      <div class="c6-right">
        <!-- Card 1 -->
        <div class="c6-card">
          <img src="https://images.pexels.com/photos/5212675/pexels-photo-5212675.jpeg" alt="Writing Instructor">
          <div class="c6-card-side-content">
            <div class="c6-vertical-text">Writing</div>
          </div>
          <div class="c6-card-content">
            <div class="c6-card-title">Writing<br>Course</div>
            <div class="c6-card-topics">
              <span class="num">100</span>
              <span class="label">Topics</span>
            </div>
          </div>
        </div>

        <!-- Card 2 -->
        <div class="c6-card">
          <img src="https://images.pexels.com/photos/8617763/pexels-photo-8617763.jpeg" alt="Writing Basics">
          <div class="c6-card-side-content">
            <div class="c6-vertical-text">Writing</div>
          </div>
          <div class="c6-card-content">
            <div class="c6-card-title">Writing<br>Course</div>
            <div class="c6-card-topics">
              <span class="num">45</span>
              <span class="label">Topics</span>
            </div>
          </div>
        </div>

        <!-- Card 3 -->
        <div class="c6-card">
          <img src="https://images.pexels.com/photos/6333648/pexels-photo-6333648.jpeg" alt="Business Mastery">
          <div class="c6-card-side-content">
            <div class="c6-vertical-text">Business</div>
          </div>
          <div class="c6-card-content">
            <div class="c6-card-title">Business<br>Mastery</div>
            <div class="c6-card-topics">
              <span class="num">82</span>
              <span class="label">Topics</span>
            </div>
          </div>
        </div>
      </div>
    </main>
    
    <!-- Footer Section -->
    <footer class="c6-bottom-info">
      <h3>Unlimited access to 100+ instructors.</h3>
    </footer>
  </div>

  <script>
    const hamburger = document.getElementById('hamburger');
    const mobileNav = document.getElementById('mobileNav');

    hamburger.addEventListener('click', () => {
      hamburger.classList.toggle('active');
      mobileNav.classList.toggle('open');
      document.body.style.overflow = mobileNav.classList.contains('open') ? 'hidden' : 'auto';
    });

    // Close menu when clicking links
    mobileNav.querySelectorAll('a').forEach(link => {
      link.addEventListener('click', () => {
        closeMenu();
      });
    });

    function closeMenu() {
      hamburger.classList.remove('active');
      mobileNav.classList.remove('open');
      document.body.style.overflow = 'auto';
    }

    // Automatically close drawer when screen size changes to desktop
    window.addEventListener('resize', () => {
      if (window.innerWidth > 768 && mobileNav.classList.contains('open')) {
        closeMenu();
      }
    });
  </script>
</body>
</html>
