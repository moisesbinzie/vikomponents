<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test 1 – Community CTA</title>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800&display=swap"
        rel="stylesheet" />
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: #f0f2f7;
            color: #1e2240;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px 16px;
        }


        .cta-section {
            width: 100%;
            padding: 0 32px 48px;
        }

        .cta-wrapper {
            position: relative;
            border-radius: 28px;
            overflow: hidden;
            border: 1px solid rgba(13, 36, 72, 0.15);
            box-shadow: 0 10px 40px rgba(100, 120, 180, 0.15);
            background: #d8e5f2;
            min-height: 220px;
            max-width: 1150px;
            margin: 0 auto;
        }

        .cta-bg {
            position: absolute;
            inset: 0;
            background: url('https://pub-f170a2592d2c4a1485466404c36807be.r2.dev/Tests/Gemini_Generated_Image_au00mfau00mfau00.png') center center / cover no-repeat;
            z-index: 0;
        }

        .cta-content {
            position: relative;
            z-index: 1;
            padding: 32px;
            max-width: 560px;
        }

        .cta-content h2 {
            font-family: 'DM Sans', sans-serif;
            font-size: 26px;
            font-weight: 700;
            color: #08063C;
            margin-bottom: 12px;
            line-height: 1.2;
            letter-spacing: -0.015em;
        }

        .cta-content p {
            font-size: 13.5px;
            font-weight: 400;
            color: #08063C;
            line-height: 1.65;
            margin-bottom: 28px;
            max-width: 400px;
        }

        .cta-form {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            max-width: 80%;
        }

        .cta-form input {
            flex: 1;
            min-width: 200px;
            padding: 13px 22px;
            border-radius: 50px;
            border: 1px solid rgba(195, 210, 235, 0.75);
            background: rgba(255, 255, 255, 0.96);
            font-family: 'DM Sans', sans-serif;
            font-size: 13px;
            color: #08063C;
            outline: none;
            box-shadow: 0 1px 5px rgba(100, 110, 180, 0.07);
            transition: box-shadow 0.2s, border-color 0.2s;
        }

        .cta-form input::placeholder {
            color: #b2bbd4;
            font-weight: 400;
        }

        .cta-form input:focus {
            border-color: rgba(130, 155, 220, 0.65);
            box-shadow: 0 1px 10px rgba(100, 120, 210, 0.16);
        }

        /* Light background, dark foreground button */
        .cta-form button {
            padding: 13px 24px;
            border-radius: 50px;
            border: none;
            background: #f8f9fc;
            color: #08063C;
            font-family: 'DM Sans', sans-serif;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            letter-spacing: 0.01em;
            box-shadow: 0 2px 10px rgba(100, 110, 180, 0.15);
            transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
        }

        .cta-form button:hover {
            background: #eef0f5;
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(100, 110, 180, 0.25);
        }

        .cta-form button:active {
            transform: translateY(0);
        }

        .cta-members {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 20px;
        }

        .cta-avatars {
            display: flex;
        }

        /* Human avatars with no ring */
        .cta-avatars span {
            display: inline-block;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: none;
            margin-left: -9px;
            overflow: hidden;
            background-size: cover;
            background-position: center top;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12);
            flex-shrink: 0;
        }

        .cta-avatars span:first-child {
            margin-left: 0;
        }

        /* Real human face avatars */
        .av1 {
            background-image: url('https://randomuser.me/api/portraits/women/44.jpg');
        }

        .av2 {
            background-image: url('https://randomuser.me/api/portraits/men/32.jpg');
        }

        .av3 {
            background-image: url('https://randomuser.me/api/portraits/women/68.jpg');
        }

        .av4 {
            background-image: url('https://randomuser.me/api/portraits/men/75.jpg');
        }

        .cta-members p {
            font-size: 12.5px;
            font-weight: 600;
            color: #08063C;
            margin: 0;
        }

        /* ── Mobile ── */
        @media (max-width: 600px) {
            .cta-content {
                padding: 24px;
                max-width: 100%;
            }

            .cta-content h2 {
                font-size: 19px;
            }

            .cta-content p {
                font-size: 11.5px;
                max-width: 100%;
                margin-bottom: 16px;
            }

            .cta-form {
                flex-direction: column;
                gap: 8px;
                max-width: 100%;
            }

            .cta-form input,
            .cta-form button {
                width: 100%;
                text-align: center;
            }

            .cta-members {
                flex-wrap: wrap;
                gap: 8px;
            }

            .cta-avatars span {
                width: 28px;
                height: 28px;
                margin-left: -7px;
            }
        }
    </style>
</head>

<body>

    <section class="cta-section">
        <div class="cta-wrapper">
            <div class="cta-bg"></div>
            <div class="cta-content">
                <h2>Subscribe to Our Community</h2>
                <p>Get exclusive access to cutting-edge tech insights, industry trends, and expert advice delivered
                    straight to your inbox. Join our growing community today!</p>
                <div class="cta-form">
                    <input type="email" placeholder="Enter your email here" />
                    <button type="button">Join Now</button>
                </div>
                <div class="cta-members">
                    <div class="cta-avatars">
                        <span class="av1"></span>
                        <span class="av2"></span>
                        <span class="av3"></span>
                        <span class="av4"></span>
                    </div>
                    <p>5,000+ happy members</p>
                </div>
            </div>
        </div>
    </section>
</body>

</html>
