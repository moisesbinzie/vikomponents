<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Xero – The Simple Way to Encrypt Your Data</title>
  <meta name="description" content="Fully managed data encrypting service and annotation platform for teams of all industries." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --surface: #111118;
      --text: #f0f0f5;
      --text-muted: #8888a8;
      --accent: #c8a0e0;
      --accent-pink: #b04090;
      --border: rgba(255,255,255,0.08);
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 14px;
    }

    /* ─── NAVBAR ─── */
    nav {
      width: 100%;
      max-width: 1100px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 24px;
      margin-bottom: 14px;
    }

    .nav-logo {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--text);
    }

    .nav-links {
      display: flex;
      gap: 32px;
      list-style: none;
    }

    .nav-links a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 400;
      transition: color 0.2s;
    }
    .nav-links a:hover { color: var(--text); }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-login {
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 7px 18px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.2s;
    }
    .btn-login:hover { background: rgba(255,255,255,0.12); }

    .btn-signup {
      background: var(--text);
      border: none;
      color: #0a0a0f;
      padding: 7px 18px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: opacity 0.2s;
    }
    .btn-signup:hover { opacity: 0.88; }

    /* ─── HERO CARD ─── */
    .hero-card {
      width: 100%;
      max-width: 1100px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.07);
      overflow: hidden;
      position: relative;
      background: #0d0b12;
      padding: 60px 40px 70px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      min-height: 520px;
    }

    /* Deep purple-magenta radial glow */
    .hero-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 70% 55% at 50% 85%, #b0308880 0%, #80106040 40%, transparent 70%),
        radial-gradient(ellipse 100% 60% at 50% 100%, #c850a020 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    /* Grid overlay */
    .hero-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
      background-size: 36px 36px;
      mask-image: radial-gradient(ellipse 80% 60% at 50% 100%, black 30%, transparent 75%);
      -webkit-mask-image: radial-gradient(ellipse 80% 60% at 50% 100%, black 30%, transparent 75%);
      z-index: 0;
      pointer-events: none;
    }

    /* ─── ICON PIPELINE ─── */
    .icon-pipeline {
      position: relative;
      display: flex;
      align-items: center;
      gap: 0;
      z-index: 1;
      margin-bottom: 52px;
    }

    .pipeline-line {
      width: 80px;
      height: 1px;
      background: linear-gradient(90deg, rgba(255,255,255,0.15), rgba(255,255,255,0.07));
      flex-shrink: 0;
    }
    .pipeline-line.right {
      background: linear-gradient(90deg, rgba(255,255,255,0.07), rgba(255,255,255,0.15));
    }

    .icon-node {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .icon-node svg {
      width: 20px;
      height: 20px;
      stroke: rgba(255,255,255,0.7);
      fill: none;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Centre Xero logo node */
    .icon-node-center {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: #1a0e2a;
      border: 1.5px solid rgba(255,255,255,0.18);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 0 0 6px rgba(255,255,255,0.04);
    }

    .icon-node-center svg {
      width: 28px;
      height: 28px;
      fill: white;
    }

    /* ─── HERO TEXT ─── */
    .hero-content {
      position: relative;
      z-index: 1;
      max-width: 620px;
    }

    .hero-heading {
      font-size: clamp(2.4rem, 5.5vw, 3.5rem);
      font-weight: 800;
      line-height: 1.12;
      letter-spacing: -0.03em;
      margin-bottom: 18px;
      color: #fff;
    }

    .hero-heading .accent-word {
      color: var(--accent);
    }

    .hero-sub {
      font-size: 0.9rem;
      font-weight: 400;
      line-height: 1.65;
      color: rgba(255,255,255,0.5);
      max-width: 380px;
      margin: 0 auto 32px;
    }

    .btn-cta {
      display: inline-block;
      background: #ffffff;
      color: #0a0a0f;
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 600;
      padding: 12px 32px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: opacity 0.2s, transform 0.15s;
      position: relative;
      z-index: 1;
    }
    .btn-cta:hover { opacity: 0.9; transform: translateY(-1px); }

    /* ─── BRAND LOGOS ─── */
    .brands {
      width: 100%;
      max-width: 1100px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 48px;
      padding: 32px 24px 10px;
      flex-wrap: wrap;
    }

    .brand-item {
      display: flex;
      align-items: center;
      gap: 8px;
      color: rgba(255,255,255,0.35);
      font-size: 0.95rem;
      font-weight: 500;
      letter-spacing: -0.01em;
      white-space: nowrap;
    }

    .brand-item svg {
      width: 18px;
      height: 18px;
      fill: rgba(255,255,255,0.35);
      flex-shrink: 0;
    }

    /* HubSpot has an accent dot */
    .hubspot-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255,255,255,0.35);
      vertical-align: super;
      margin-left: 1px;
    }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <nav>
    <span class="nav-logo">Xero</span>
    <ul class="nav-links">
      <li><a href="#">Method</a></li>
      <li><a href="#">Pricing</a></li>
      <li><a href="#">Docs</a></li>
    </ul>
    <div class="nav-actions">
      <button class="btn-login">Login</button>
      <button class="btn-signup">Sign Up</button>
    </div>
  </nav>

  <!-- HERO CARD -->
  <section class="hero-card">
    <div class="hero-grid"></div>

    <!-- Icon Pipeline -->
    <div class="icon-pipeline">
      <!-- Layers icon -->
      <div class="icon-node">
        <svg viewBox="0 0 24 24">
          <polygon points="12 2 2 7 12 12 22 7 12 2"/>
          <polyline points="2 17 12 22 22 17"/>
          <polyline points="2 12 12 17 22 12"/>
        </svg>
      </div>

      <div class="pipeline-line"></div>

      <!-- Center Xero logo -->
      <div class="icon-node-center">
        <!-- X mark SVG -->
        <svg viewBox="0 0 24 24" fill="white" xmlns="http://www.w3.org/2000/svg">
          <path d="M18.36 5.64a1 1 0 0 0-1.41 0L12 10.59 7.05 5.64A1 1 0 1 0 5.64 7.05L10.59 12l-4.95 4.95a1 1 0 1 0 1.41 1.41L12 13.41l4.95 4.95a1 1 0 0 0 1.41-1.41L13.41 12l4.95-4.95a1 1 0 0 0 0-1.41z"/>
        </svg>
      </div>

      <div class="pipeline-line right"></div>

      <!-- Shield icon -->
      <div class="icon-node">
        <svg viewBox="0 0 24 24">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <polyline points="9 12 11 14 15 10"/>
        </svg>
      </div>
    </div>

    <!-- Hero Text -->
    <div class="hero-content">
      <h1 class="hero-heading">
        The simple way<br>
        encryption your <span class="accent-word">data</span>
      </h1>
      <p class="hero-sub">
        Fully managed data encrypting service and annotation<br>
        platform for teams of all industries.
      </p>
      <a href="#" class="btn-cta">Get Started</a>
    </div>
  </section>

  <!-- BRAND LOGOS -->
  <div class="brands">
    <!-- Expedia -->
    <div class="brand-item">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <circle cx="12" cy="12" r="10"/>
        <path fill="var(--bg)" d="M8 9h8v2H8zm0 4h6v2H8z"/>
      </svg>
      <span>Expedia</span>
    </div>

    <!-- asana -->
    <div class="brand-item">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <circle cx="12" cy="7" r="4"/>
        <circle cx="5" cy="16" r="3.5"/>
        <circle cx="19" cy="16" r="3.5"/>
      </svg>
      <span>asana</span>
    </div>

    <!-- zenefits -->
    <div class="brand-item">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <polyline points="4 8 20 8" stroke="rgba(255,255,255,0.35)" stroke-width="2" fill="none" stroke-linecap="round"/>
        <polyline points="4 12 12 12" stroke="rgba(255,255,255,0.35)" stroke-width="2" fill="none" stroke-linecap="round"/>
        <polyline points="4 16 20 16" stroke="rgba(255,255,255,0.35)" stroke-width="2" fill="none" stroke-linecap="round"/>
      </svg>
      <span>zenefits</span>
    </div>

    <!-- HubSpot -->
    <div class="brand-item">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <circle cx="15.5" cy="8.5" r="2.5"/>
        <circle cx="8.5" cy="8.5" r="2" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"/>
        <path d="M15.5 11v5M8.5 10.5V16M6 16h5M13 16h5" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" stroke-linecap="round" fill="none"/>
      </svg>
      <span>HubSp<span class="hubspot-dot"></span>t</span>
    </div>

    <!-- loom -->
    <div class="brand-item">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <circle cx="12" cy="12" r="9" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" fill="none"/>
        <line x1="12" y1="3" x2="12" y2="21" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"/>
        <line x1="3" y1="12" x2="21" y2="12" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"/>
        <path d="M5 5l14 14M19 5 5 19" stroke="rgba(255,255,255,0.35)" stroke-width="1.1"/>
      </svg>
      <span>loom</span>
    </div>
  </div>

</body>
</html>
