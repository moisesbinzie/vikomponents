<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Xero – The Simple Way to Encrypt Your Data</title>
    <meta name="description"
        content="Fully managed data encrypting service and annotation platform for teams of all industries." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #0a0a0f;
            --surface: #111118;
            --text: #f0f0f5;
            --text-muted: #8888a8;
            --accent: #c8a0e0;
            --accent-pink: #b04090;
            --border: rgba(255, 255, 255, 0.08);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 14px;
        }

        /* ─── NAVBAR ─── */
        nav {
            width: 100%;
            max-width: 1100px;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            padding: 12px 24px;
            margin-bottom: 14px;
        }

        .nav-logo {
            font-size: 1.05rem;
            font-weight: 700;
            letter-spacing: -0.01em;
            color: var(--text);
            justify-self: start;
        }

        .nav-menu {
            display: contents;
            /* Allows children to be grid items of the nav */
        }

        .nav-links {
            display: flex;
            gap: 32px;
            list-style: none;
            justify-self: center;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 400;
            transition: color 0.2s;
        }

        .nav-links a:hover {
            color: var(--text);
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            justify-self: end;
        }

        .btn-login {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 7px 18px;
            border-radius: 999px;
            font-size: 0.82rem;
            font-weight: 500;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.2s;
        }

        .btn-login:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        .btn-signup {
            background: var(--text);
            border: none;
            color: #0a0a0f;
            padding: 7px 18px;
            border-radius: 999px;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: opacity 0.2s;
        }

        .btn-signup:hover {
            opacity: 0.88;
        }

        /* ─── MENU TOGGLE ─── */
        .menu-toggle {
            display: none;
            flex-direction: column;
            justify-content: space-between;
            width: 24px;
            height: 14px;
            background: none;
            border: none;
            cursor: pointer;
            z-index: 1001;
            padding: 0;
            justify-self: end;
        }

        .menu-toggle span {
            width: 100%;
            height: 2px;
            background: var(--text);
            border-radius: 2px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            transform-origin: center;
        }

        .menu-toggle.active span:nth-child(1) {
            transform: translateY(6px) rotate(45deg);
        }

        .menu-toggle.active span:nth-child(2) {
            transform: translateY(-6px) rotate(-45deg);
        }

        /* ─── HERO CARD ─── */
        .hero-card {
            width: 100%;
            max-width: 1100px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.07);
            overflow: hidden;
            position: relative;
            background: #0d0b12;
            padding: 60px 40px 70px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            min-height: 624px;
            /* Increased from 520px by 20% */
        }

        /* Deep purple-magenta radial glow */
        .hero-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse 70% 55% at 50% 85%, #b0308880 0%, #80106040 40%, transparent 70%),
                radial-gradient(ellipse 100% 60% at 50% 100%, #c850a020 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
        }

        /* Grid overlay */
        .hero-grid {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
            background-size: 36px 36px;
            mask-image: radial-gradient(ellipse 80% 60% at 50% 100%, black 30%, transparent 75%);
            -webkit-mask-image: radial-gradient(ellipse 80% 60% at 50% 100%, black 30%, transparent 75%);
            z-index: 0;
            pointer-events: none;
        }

        /* ─── ICON PIPELINE ─── */
        .icon-pipeline {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0;
            z-index: 1;
            margin-bottom: 52px;
            width: 100%;
            max-width: 700px;
            /* Increased from 400px */
        }

        .beam-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
            overflow: visible;
        }

        .pipeline-line {
            width: 160px;
            /* Doubled from 80px */
            height: 1px;
            background: linear-gradient(90deg, rgba(255, 255, 255, 0.15), rgba(255, 255, 255, 0.07));
            flex-shrink: 1;
            /* Allow shrinking on smaller screens */
            position: relative;
            z-index: 1;
        }

        .pipeline-line.right {
            background: linear-gradient(90deg, rgba(255, 255, 255, 0.07), rgba(255, 255, 255, 0.15));
        }

        .icon-node {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: rgba(20, 15, 25, 0.95);
            /* More opaque background */
            border: 1px solid rgba(255, 255, 255, 0.12);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            position: relative;
            z-index: 3;
            backdrop-filter: blur(4px);
        }

        .icon-node svg {
            width: 20px;
            height: 20px;
            stroke: rgba(255, 255, 255, 0.7);
            fill: none;
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Centre Xero logo node */
        .icon-node-center {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: #1a0e2a;
            border: 1.5px solid rgba(255, 255, 255, 0.18);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 0 0 6px rgba(255, 255, 255, 0.04);
            position: relative;
            z-index: 3;
        }

        .icon-node-center svg {
            width: 28px;
            height: 28px;
            fill: white;
        }

        /* ─── HERO TEXT ─── */
        .hero-content {
            position: relative;
            z-index: 1;
            max-width: 620px;
        }

        .hero-heading {
            font-size: clamp(2.4rem, 5.5vw, 3.5rem);
            font-weight: 500;
            line-height: 1.12;
            letter-spacing: -0.02em;
            margin-bottom: 18px;

            /* Gradient text */
            background: linear-gradient(to right, #ffffff 30%, rgba(255, 255, 255, 0.45) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: #fff;
            /* Fallback */
        }

        .hero-heading .accent-word {
            color: var(--accent);
            -webkit-text-fill-color: var(--accent);
            /* Ensure accent color shows over the parent gradient */
        }

        .hero-sub {
            font-size: 0.9rem;
            font-weight: 400;
            line-height: 1.65;
            color: rgba(255, 255, 255, 0.5);
            max-width: 380px;
            margin: 0 auto 32px;
        }

        .btn-cta {
            display: inline-block;
            background: #ffffff;
            color: #0a0a0f;
            font-family: inherit;
            font-size: 0.88rem;
            font-weight: 600;
            padding: 12px 32px;
            border-radius: 999px;
            border: none;
            cursor: pointer;
            text-decoration: none;
            transition: opacity 0.2s, transform 0.15s;
            position: relative;
            z-index: 1;
        }

        .btn-cta:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        /* ─── BRAND LOGOS ─── */
        .brands {
            width: 100%;
            max-width: 1100px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 48px;
            padding: 32px 24px 10px;
            flex-wrap: wrap;
        }

        .brand-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: rgba(255, 255, 255, 0.35);
            font-size: 0.95rem;
            font-weight: 500;
            letter-spacing: -0.01em;
            white-space: nowrap;
        }

        .brand-item svg {
            width: 18px;
            height: 18px;
            fill: rgba(255, 255, 255, 0.35);
            flex-shrink: 0;
        }

        /* HubSpot has an accent dot */
        .hubspot-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.35);
            vertical-align: super;
            margin-left: 1px;
        }

        /* ─── RESPONSIVE ─── */
        @media (max-width: 860px) {
            .icon-pipeline {
                gap: 0;
                margin-bottom: 40px;
            }

            .pipeline-line {
                width: 80px;
            }
        }

        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            nav {
                display: flex;
                justify-content: space-between;
                padding: 12px 16px;
                position: relative;
                z-index: 1000;
            }

            .menu-toggle {
                display: flex;
            }

            .nav-menu {
                position: fixed;
                top: 0;
                right: -100%;
                width: 100%;
                height: 100vh;
                background: var(--bg);
                display: flex;
                /* Overrides display: contents */
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 40px;
                transition: right 0.4s cubic-bezier(0.4, 0, 0.2, 1);
                z-index: 1000;
                padding: 40px;
            }

            .nav-menu.active {
                right: 0;
            }

            .nav-links {
                flex-direction: column;
                align-items: center;
                gap: 24px;
            }

            .nav-links a {
                font-size: 1.2rem;
            }

            .nav-actions {
                flex-direction: column;
                width: 100%;
                max-width: 280px;
                gap: 12px;
            }

            .nav-actions button {
                width: 100%;
                padding: 12px;
                font-size: 0.9rem;
            }

            .hero-card {
                padding: 60px 20px 60px;
                min-height: auto;
            }

            .icon-pipeline {
                margin-bottom: 32px;
            }

            .pipeline-line {
                width: 80px;
            }

            .icon-node {
                width: 38px;
                height: 38px;
                z-index: 3;
            }

            .icon-node-center {
                width: 52px;
                height: 52px;
                z-index: 3;
            }

            .hero-heading br {
                display: none;
            }

            .hero-sub br {
                display: none;
            }

            .brands {
                gap: 32px;
            }
        }

        @media (max-width: 480px) {
            .icon-pipeline {
                transform: scale(1); /* Maintain size */
            }

            .hero-card {
                border-radius: 16px;
            }

            .brands {
                gap: 24px;
            }
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <nav>
        <span class="nav-logo">Xero</span>

        <div class="nav-menu" id="navMenu">
            <ul class="nav-links">
                <li><a href="#">Method</a></li>
                <li><a href="#">Pricing</a></li>
                <li><a href="#">Docs</a></li>
            </ul>
            <div class="nav-actions">
                <button class="btn-login">Login</button>
                <button class="btn-signup">Sign Up</button>
            </div>
        </div>

        <button class="menu-toggle" id="menuToggle" aria-label="Toggle Navigation">
            <span></span>
            <span></span>
        </button>
    </nav>

    <!-- HERO CARD -->
    <section class="hero-card">
        <div class="hero-grid"></div>

        <!-- Icon Pipeline -->
        <div class="icon-pipeline" id="pipeline">
            <!-- Animated Beam SVG (Moved to first child to be behind other elements) -->
            <svg id="beam-svg" class="beam-svg">
                <defs>
                    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur stdDeviation="2" result="blur" />
                        <feComposite in="SourceGraphic" in2="blur" operator="over" />
                    </filter>
                    <linearGradient id="beam-gradient" gradientUnits="userSpaceOnUse">
                        <stop offset="0%" stop-color="#b04090" stop-opacity="0" />
                        <stop offset="20%" stop-color="#b04090" stop-opacity="0.8" />
                        <stop offset="50%" stop-color="#fff" stop-opacity="1" />
                        <stop offset="80%" stop-color="#c8a0e0" stop-opacity="0.8" />
                        <stop offset="100%" stop-color="#c8a0e0" stop-opacity="0" />
                    </linearGradient>
                </defs>
                <!-- Glow layer -->
                <path id="beam-path-glow" stroke="url(#beam-gradient)" stroke-width="2" fill="none"
                    stroke-linecap="round" filter="url(#glow)" style="opacity: 0.6;" />
                <!-- Core layer -->
                <path id="beam-path" stroke="url(#beam-gradient)" stroke-width="0.8" fill="none"
                    stroke-linecap="round" />
            </svg>

            <!-- Layers icon -->
            <div class="icon-node" id="node-stack">
                <svg viewBox="0 0 24 24">
                    <polygon points="12 2 2 7 12 12 22 7 12 2" />
                    <polyline points="2 17 12 22 22 17" />
                    <polyline points="2 12 12 17 22 12" />
                </svg>
            </div>

            <div class="pipeline-line"></div>

            <!-- Center Xero logo -->
            <div class="icon-node-center" id="node-x">
                <!-- X mark SVG -->
                <svg viewBox="0 0 24 24" fill="white" xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M18.36 5.64a1 1 0 0 0-1.41 0L12 10.59 7.05 5.64A1 1 0 1 0 5.64 7.05L10.59 12l-4.95 4.95a1 1 0 1 0 1.41 1.41L12 13.41l4.95 4.95a1 1 0 0 0 1.41-1.41L13.41 12l4.95-4.95a1 1 0 0 0 0-1.41z" />
                </svg>
            </div>

            <div class="pipeline-line right"></div>

            <!-- Shield icon -->
            <div class="icon-node" id="node-shield">
                <svg viewBox="0 0 24 24">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
                    <polyline points="9 12 11 14 15 10" />
                </svg>
            </div>
        </div>

        <!-- Hero Text -->
        <div class="hero-content">
            <h1 class="hero-heading">
                The simple way<br>
                to encrypt your data
            </h1>
            <p class="hero-sub">
                Fully managed data encrypting service and annotation<br>
                platform for teams of all industries.
            </p>
            <a href="#" class="btn-cta">Get Started</a>
        </div>
    </section>

    <!-- BRAND LOGOS -->
    <div class="brands">
        <!-- Expedia -->
        <div class="brand-item">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <circle cx="12" cy="12" r="10" />
                <path fill="var(--bg)" d="M8 9h8v2H8zm0 4h6v2H8z" />
            </svg>
            <span>Expedia</span>
        </div>

        <!-- asana -->
        <div class="brand-item">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <circle cx="12" cy="7" r="4" />
                <circle cx="5" cy="16" r="3.5" />
                <circle cx="19" cy="16" r="3.5" />
            </svg>
            <span>asana</span>
        </div>

        <!-- zenefits -->
        <div class="brand-item">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <polyline points="4 8 20 8" stroke="rgba(255,255,255,0.35)" stroke-width="2" fill="none"
                    stroke-linecap="round" />
                <polyline points="4 12 12 12" stroke="rgba(255,255,255,0.35)" stroke-width="2" fill="none"
                    stroke-linecap="round" />
                <polyline points="4 16 20 16" stroke="rgba(255,255,255,0.35)" stroke-width="2" fill="none"
                    stroke-linecap="round" />
            </svg>
            <span>zenefits</span>
        </div>

        <!-- HubSpot -->
        <div class="brand-item">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <circle cx="15.5" cy="8.5" r="2.5" />
                <circle cx="8.5" cy="8.5" r="2" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" />
                <path d="M15.5 11v5M8.5 10.5V16M6 16h5M13 16h5" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"
                    stroke-linecap="round" fill="none" />
            </svg>
            <span>HubSp<span class="hubspot-dot"></span>t</span>
        </div>

        <!-- loom -->
        <div class="brand-item">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <circle cx="12" cy="12" r="9" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" fill="none" />
                <line x1="12" y1="3" x2="12" y2="21" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" />
                <line x1="3" y1="12" x2="21" y2="12" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" />
                <path d="M5 5l14 14M19 5 5 19" stroke="rgba(255,255,255,0.35)" stroke-width="1.1" />
            </svg>
            <span>loom</span>
        </div>
    </div>

    <script>
        const menuToggle = document.getElementById('menuToggle');
        const navMenu = document.getElementById('navMenu');

        menuToggle.addEventListener('click', () => {
            menuToggle.classList.toggle('active');
            navMenu.classList.toggle('active');

            if (navMenu.classList.contains('active')) {
                document.body.style.overflow = 'hidden';
            } else {
                document.body.style.overflow = '';
            }
        });

        const closeItems = document.querySelectorAll('.nav-links a, .nav-actions button');
        closeItems.forEach(item => {
            item.addEventListener('click', () => {
                menuToggle.classList.remove('active');
                navMenu.classList.remove('active');
                document.body.style.overflow = '';
            });
        });

        // --- ANIMATED BEAM LOGIC ---
        const pipeline = document.getElementById('pipeline');
        const nodeStack = document.getElementById('node-stack');
        const nodeX = document.getElementById('node-x');
        const nodeShield = document.getElementById('node-shield');
        const beamPath = document.getElementById('beam-path');
        const beamPathGlow = document.getElementById('beam-path-glow');
        const beamGradient = document.getElementById('beam-gradient');

        function updateBeamPath() {
            if (!pipeline || !nodeStack || !nodeX || !nodeShield || !beamPath) return;

            const pRect = pipeline.getBoundingClientRect();
            const sRect = nodeStack.getBoundingClientRect();
            const xRect = nodeX.getBoundingClientRect();
            const shRect = nodeShield.getBoundingClientRect();

            const startX = (sRect.left + sRect.width / 2) - pRect.left;
            const startY = (sRect.top + sRect.height / 2) - pRect.top;

            const midX = (xRect.left + xRect.width / 2) - pRect.left;
            const midY = (xRect.top + xRect.height / 2) - pRect.top;

            const endX = (shRect.left + shRect.width / 2) - pRect.left;
            const endY = (shRect.top + shRect.height / 2) - pRect.top;

            const d = `M ${startX},${startY} L ${midX},${midY} L ${endX},${endY}`;
            beamPath.setAttribute('d', d);
            if (beamPathGlow) beamPathGlow.setAttribute('d', d);
        }

        let startTime = null;
        const duration = 3000;

        function animate(timestamp) {
            if (!startTime) startTime = timestamp;
            const progress = (timestamp - startTime) % duration;
            const percentage = progress / duration;

            // Move the gradient from -50% to 150% to ensure it fully passes through
            const x1 = -50 + (percentage * 200);
            const x2 = x1 + 15; // 15% width beam (halved from 30)

            beamGradient.setAttribute('x1', `${x1}%`);
            beamGradient.setAttribute('x2', `${x2}%`);
            beamGradient.setAttribute('y1', '0%');
            beamGradient.setAttribute('y2', '0%');

            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', updateBeamPath);
        updateBeamPath();
        requestAnimationFrame(animate);
    </script>

</body>

</html>
